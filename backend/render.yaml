services:
  - type: web
    name: backstreet-dogs-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://backstreetdogs.xyz,https://www.backstreetdogs.xyz
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: backstreet-dogs-db
          property: connectionString

databases:
  - name: backstreet-dogs-db
    plan: free
    region: oregon
